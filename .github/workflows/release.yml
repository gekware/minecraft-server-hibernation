name: Manual Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing version tag to release (e.g., v2.5.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      short_commit: ${{ steps.release.outputs.short_commit }}
    steps:
      - name: Validate version and resolve its tag
        id: release
        uses: actions/github-script@v8
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        with:
          script: |
            const version = process.env.RELEASE_VERSION;
            if (!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(version) || version.trim() !== version) {
              throw new Error('Version must have the form vX.Y.Z.');
            }

            const repo = context.repo;
            for await (const page of github.paginate.iterator(github.rest.repos.listReleases, {
              ...repo, per_page: 100
            })) {
              if (page.data.some(release => release.tag_name === version)) {
                throw new Error(`A release already exists for ${version}; refusing to replace it.`);
              }
            }

            // Resolve both lightweight and annotated tags to one immutable checkout.
            let { data: { object } } = await github.rest.git.getRef({
              ...repo, ref: `tags/${version}`
            });
            while (object.type === 'tag') {
              const { data: tag } = await github.rest.git.getTag({
                ...repo, tag_sha: object.sha
              });
              object = tag.object;
            }
            if (object.type !== 'commit') {
              throw new Error(`${version} must point to a commit.`);
            }

            core.setOutput('version', version);
            core.setOutput('commit', object.sha);
            core.setOutput('short_commit', object.sha.slice(0, 7));

  build:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: darwin
            arch: amd64
            suffix: .osx
          - os: darwin
            arch: arm64
            suffix: .osx
          - os: linux
            arch: amd64
            suffix: .bin
          - os: linux
            arch: arm
            suffix: .bin
          - os: linux
            arch: arm64
            suffix: .bin
          - os: windows
            arch: amd64
            suffix: .exe
          - os: windows
            arch: arm64
            suffix: .exe

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          SUFFIX: ${{ matrix.suffix }}
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.short_commit }}
        run: |
          FILENAME="msh-${VERSION}-${COMMIT}-${GOOS}-${GOARCH}${SUFFIX}"

          go build -v \
            -ldflags="-X 'msh/lib/progmgr.MshVersion=${VERSION}' -X 'msh/lib/progmgr.MshCommit=${COMMIT}'" \
            -o "dist/${FILENAME}" .

          # Copy the config file into the dist folder so it's collected for every matrix run
          cp msh-config.json dist/msh-config.json

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.commit }}
          name: Release ${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: false
          files: |
            dist/*
            ${{ strategy.job-index == 0 && 'msh-config.json' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
